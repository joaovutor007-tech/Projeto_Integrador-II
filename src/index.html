<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda CTBJ — Organização Digital da Rotina Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Agenda CTBJ</h1>
            <p>Organização Digital da Rotina Escolar</p>
        </div>
    </header>

    <main class="container">
        <!-- Seção de Cadastro / Atualização (RF01–RF04, RF07) -->
        <section class="card-section">
            <h2>Cadastrar / Atualizar Item</h2>
            <form id="form-agenda">
                <div class="form-group">
                    <label for="tipo">Tipo de Informação:</label>
                    <select id="tipo" required>
                        <option value="">Selecione...</option>
                        <option value="atividade">Atividade</option>
                        <option value="prova">Prova</option>
                        <option value="trabalho">Trabalho</option>
                        <option value="evento">Evento</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="titulo">Título / Descrição:</label>
                    <input type="text" id="titulo" placeholder="Ex: Prova de Matemática ou Trabalho de História" required>
                </div>

                <!-- Campo dinâmico para Disciplina (Regra de Negócio RN02) -->
                <div class="form-group" id="campo-disciplina" style="display: none;">
                    <label for="disciplina">Disciplina:</label>
                    <input type="text" id="disciplina" placeholder="Ex: Matemática, Português, Biologia">
                </div>

                <div class="form-group">
                    <label for="data">Data / Data de Entrega:</label>
                    <input type="date" id="data" required>
                </div>

                <div class="form-group">
                    <label for="observacao">Observações / Detalhes:</label>
                    <textarea id="observacao" rows="3" placeholder="Informações adicionais do evento ou atividade..."></textarea>
                </div>

                <button type="submit" id="btn-salvar">Salvar na Agenda</button>
            </form>
        </section>

        <!-- Seção de Filtros e Consulta (RF05, RF08) -->
        <section class="card-section">
            <h2>Consulta de Tarefas e Eventos</h2>
            <div class="filtros">
                <button class="btn-filtro active" data-categoria="todos">Todos</button>
                <button class="btn-filtro" data-categoria="atividade">Atividades</button>
                <button class="btn-filtro" data-categoria="prova">Provas</button>
                <button class="btn-filtro" data-categoria="trabalho">Trabalhos</button>
                <button class="btn-filtro" data-categoria="evento">Eventos</button>
            </div>

            <!-- Exibição das Informações Organizadas por Data (RF06, RN05) -->
            <div id="lista-agenda" class="lista-itens">
                <!-- Os itens cadastrados serão renderizados dinamicamente pelo JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Agenda CTBJ — Projeto Integrador II</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
